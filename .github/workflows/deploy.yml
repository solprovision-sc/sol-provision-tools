name: Deploy to VPS

on:
  push:
    branches:
      - main

# Serialised against deploy-portal.yml: both run `git reset --hard` in the SAME
# checkout (/var/www/sol-provision-tools), so a push touching app/ and portal/
# together would otherwise race on .git/index.lock.
concurrency:
  group: vps-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/sol-provision-tools
            git config --global --add safe.directory /var/www/sol-provision-tools
            git fetch origin main
            git reset --hard origin/main
            /var/www/sol-provision-tools/venv/bin/pip install -r requirements.txt --quiet
            sudo systemctl restart solprovision