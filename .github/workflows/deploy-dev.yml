name: Deploy to VPS (Dev)
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/sol-provision-tools-dev
            git config --global --add safe.directory /var/www/sol-provision-tools-dev
            git fetch origin dev
            git reset --hard origin/dev
            /var/www/sol-provision-tools-dev/venv/bin/pip install -r requirements.txt --quiet
            sudo systemctl restart solprovision-dev