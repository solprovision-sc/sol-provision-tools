name: Deploy to VPS (Dev)
on:
  push:
    branches:
      - dev
    # Portal-only changes are deployed by deploy-portal-dev.yml; without this
    # every portal commit would also restart the tools app for no reason.
    # shared/** is deliberately NOT ignored — a brand token change affects both.
    paths-ignore:
      - 'portal/**'

# Shared with deploy-portal-dev.yml. Both workflows `git reset --hard` the same
# checkout on the VPS, so a push touching app/ and portal/ together must not run
# them concurrently — they would race on .git/index.lock.
concurrency:
  group: vps-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/sol-provision-tools-dev
            git config --global --add safe.directory /var/www/sol-provision-tools-dev
            git fetch origin dev
            git reset --hard origin/dev
            /var/www/sol-provision-tools-dev/venv/bin/pip install -r requirements.txt --quiet
            sudo systemctl restart solprovision-dev