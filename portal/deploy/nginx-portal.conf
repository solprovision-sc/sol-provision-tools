# Provisioner Portal — PROD
#
# Install to /etc/nginx/sites-available/solprovision-portal and symlink into
# sites-enabled. This is the PRE-CERTBOT form: plain :80 only. Run
#   sudo certbot --nginx -d portal.solprovision.com
# afterwards and it will add the listen 443 / ssl_certificate lines and the
# http->https redirect, exactly as it did for portal-dev.
#
# Ports on this box: 5000 tools prod, 5001 tools dev, 5002 portal dev,
# 5003 portal prod.

server {
    listen 80;
    server_name portal.solprovision.com;

    # Portal's own static assets, served off disk rather than through Flask.
    location /static/ {
        alias /var/www/sol-provision-tools/portal/static/;
        access_log off;
        expires 30d;
    }

    # Shared brand layer (brand.css + woff2 faces). The app also serves this
    # itself at /brand/, so this block is purely an optimisation — but it must
    # point at the SHARED directory, not the portal's static folder.
    location /brand/ {
        alias /var/www/sol-provision-tools/shared/brand/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass         http://127.0.0.1:5003;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
